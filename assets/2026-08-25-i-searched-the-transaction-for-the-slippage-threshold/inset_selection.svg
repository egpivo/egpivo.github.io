<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="t">Selecting on route is not setting route</title>
<desc id="d">Route sits below both the assigned slippage and the unmeasured market state. The experiment observes brackets whose route repeated; it never assigns the route.</desc>
<rect width="620" height="300" fill="#FBFAF8"/>
<defs>
