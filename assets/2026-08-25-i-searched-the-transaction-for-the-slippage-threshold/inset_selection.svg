<circle cx="96" cy="142" r="26" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="2.5"/>
<text x="96" y="148" font-size="17" font-weight="600" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">S</text>
<text x="96" y="184" font-size="11.5" text-anchor="middle" fill="#5F6368">slippage</text>
<text x="96" y="106" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2F6B4F">do(slippage)</text>
