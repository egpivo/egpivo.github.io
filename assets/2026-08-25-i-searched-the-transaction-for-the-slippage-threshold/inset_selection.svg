<circle cx="300.0" cy="99.2" r="8" fill="#FBFAF8" opacity="0.92"/>
<text x="300.0" y="99.2" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#8A6438">?</text>
