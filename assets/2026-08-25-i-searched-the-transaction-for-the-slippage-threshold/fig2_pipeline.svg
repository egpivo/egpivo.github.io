<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="t">What survives each stage of transaction construction</title>
<desc id="d">Requested slippage is explicit in the response and fixes the minimum-output threshold by an exact integer relation. A route and topology gate admits five of ten brackets. In the admitted transactions the quoted amount is recoverable as a literal at one instruction and offset; the threshold is not recoverable under the tested encoding family. Settlement is outside the observation boundary.</desc>
<rect width="1000" height="372" fill="#FBFAF8"/>
<defs>
<marker id="a-caused" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6B4F"/></marker>
<marker id="a-together" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A6438"/></marker>
<marker id="a-candidate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7A5C9E"/></marker>
<marker id="a-not_observed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8F96"/></marker>
</defs>
<rect x="26" y="74" width="176" height="150" rx="6" fill="#F4F2EE" stroke="#2F6B4F" stroke-width="1.6"/>
<text x="114" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2328" letter-spacing="0.06em">REQUEST</text>
<text x="114" y="117" font-size="10.5" text-anchor="middle" fill="#8A8F96">what I set</text>
<text x="42" y="148" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">S</text>
<text x="64" y="148" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">slippageBps</text>
<path d="M205,149 L218,149" fill="none" stroke="#B4B0A8" stroke-width="1.5" marker-end="url(#a-caused)"/>
<rect x="222" y="74" width="176" height="150" rx="6" fill="#F4F2EE" stroke="#2F6B4F" stroke-width="1.6"/>
<text x="310" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2328" letter-spacing="0.06em">RESPONSE</text>
<text x="310" y="117" font-size="10.5" text-anchor="middle" fill="#8A8F96">named fields</text>
<text x="238" y="148" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">Q</text>
<text x="260" y="148" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">outAmount</text>
<text x="238" y="190" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">M</text>
<text x="260" y="190" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">otherAmountThreshold</text>
<path d="M401,149 L414,149" fill="none" stroke="#B4B0A8" stroke-width="1.5" marker-end="url(#a-caused)"/>
<rect x="418" y="74" width="176" height="150" rx="6" fill="#F4F2EE" stroke="#8A6438" stroke-width="1.6"/>
<text x="506" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2328" letter-spacing="0.06em">GATE</text>
<text x="506" y="117" font-size="10.5" text-anchor="middle" fill="#8A8F96">route + topology</text>
<text x="434" y="148" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">E</text>
<text x="456" y="148" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">5 of 10 brackets</text>
<path d="M597,149 L610,149" fill="none" stroke="#B4B0A8" stroke-width="1.5" marker-end="url(#a-caused)"/>
<rect x="614" y="74" width="176" height="150" rx="6" fill="#F4F2EE" stroke="#7A5C9E" stroke-width="1.6"/>
<text x="702" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2328" letter-spacing="0.06em">TRANSACTION</text>
<text x="702" y="117" font-size="10.5" text-anchor="middle" fill="#8A8F96">unnamed bytes</text>
<text x="630" y="148" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">Q</text>
<text x="652" y="148" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">ix 2 off 99</text>
<text x="630" y="190" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">M</text>
<text x="652" y="190" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">not recovered</text>
<path d="M793,149 L806,149" fill="none" stroke="#B4B0A8" stroke-width="1.5" marker-end="url(#a-caused)"/>
<rect x="810" y="74" width="176" height="150" rx="6" fill="#F4F2EE" stroke="#8A8F96" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="898" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2328" letter-spacing="0.06em">SETTLEMENT</text>
<text x="898" y="117" font-size="10.5" text-anchor="middle" fill="#8A8F96">nothing signed</text>
<text x="826" y="148" font-size="15" font-weight="700" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">Y</text>
<text x="848" y="148" font-size="10.5" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">no observation</text>
<text x="310" y="246" font-size="10.5" text-anchor="middle" fill="#2F6B4F" font-weight="600">exact: 30/30</text>
<text x="310" y="261" font-size="9.5" text-anchor="middle" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">M = ceil(Q(10000-S)/10000)</text>
<text x="506" y="246" font-size="10.5" text-anchor="middle" fill="#8A6438" font-weight="600">S &#8594; R &#8592; U</text>
<text x="506" y="261" font-size="9.5" text-anchor="middle" fill="#5F6368">a filter, not an intervention</text>
<text x="702" y="246" font-size="10.5" text-anchor="middle" fill="#7A5C9E" font-weight="600">Q in 15/15, unique site</text>
<text x="702" y="261" font-size="9.5" text-anchor="middle" fill="#5F6368">M, Q&#8722;M: no match under F</text>
<line x1="800" y1="54" x2="800" y2="274" stroke="#B4B0A8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="794" y="48" font-size="10.5" fill="#8A8F96" text-anchor="end">observation boundary</text>
<text x="26" y="40" font-size="13" font-weight="700" fill="#1F2328">What is still legible at each stage</text>
<text x="26" y="57" font-size="10.5" fill="#5F6368">Named response fields become unnamed instruction bytes. Only some of them are recoverable as literals afterwards.</text>
<text x="26" y="306" font-size="11" font-weight="600" fill="#1F2328">Evidence class</text>
<line x1="26" y1="322" x2="52" y2="322" stroke="#2F6B4F" stroke-width="2.6" opacity="1.0"/>
<text x="58" y="326" font-size="10.5" fill="#2F6B4F" font-weight="600">=</text>
<text x="72" y="326" font-size="10.5" fill="#5F6368">Exact response relation</text>
<line x1="236.0" y1="322" x2="262.0" y2="322" stroke="#8A6438" stroke-width="1.6" stroke-dasharray="2 4" opacity="1.0"/>
<text x="268.0" y="326" font-size="10.5" fill="#8A6438" font-weight="600">?</text>
<text x="282.0" y="326" font-size="10.5" fill="#5F6368">Observed together</text>
<line x1="410.0" y1="322" x2="436.0" y2="322" stroke="#7A5C9E" stroke-width="2.0" stroke-dasharray="7 4" opacity="1.0"/>
<text x="442.0" y="326" font-size="10.5" fill="#7A5C9E" font-weight="600">~</text>
<text x="456.0" y="326" font-size="10.5" fill="#5F6368">Candidate byte match</text>
<line x1="602.0" y1="322" x2="628.0" y2="322" stroke="#8A8F96" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.55"/>
<text x="634.0" y="326" font-size="10.5" fill="#8A8F96" font-weight="600">x</text>
<text x="648.0" y="326" font-size="10.5" fill="#5F6368">Not identified under this search</text>
</svg>
