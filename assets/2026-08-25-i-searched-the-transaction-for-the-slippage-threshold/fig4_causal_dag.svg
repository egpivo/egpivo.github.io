<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="t">Structural causal diagram for the DFlow route-stable bracket experiment</title>
<desc id="d">Slippage is set by hand and determines the minimum-output threshold exactly. Route sits downstream of both slippage and unmeasured market state, forming a collider. The quoted output has a candidate byte match in the unsigned transaction; the threshold does not. Settlement lies beyond the observation boundary.</desc>
