<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="t">Bracket 6: stable anchors, rerouted treatment</title>
<desc id="d">Both anchor requests returned the same route fingerprint while the treatment request between them returned a different venue, so anchor stability alone does not license attributing the difference to the treatment.</desc>
<rect width="900" height="330" fill="#FBFAF8"/>
<defs>
<marker id="a-caused" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6B4F"/></marker>
<marker id="a-together" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A6438"/></marker>
<marker id="a-candidate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7A5C9E"/></marker>
<marker id="a-not_observed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8F96"/></marker>
</defs>
<text x="450" y="34" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2328">Bracket 6 — pattern 50 / 10 / 50</text>
<rect x="54" y="62" width="236" height="96" rx="5" fill="#F4F2EE" stroke="#B4B0A8" stroke-width="1.3"/>
<text x="172" y="86" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2328">A1 · 50 bps (anchor)</text>
<text x="172" y="112" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">Tessera V</text>
<text x="172" y="132" font-size="11" text-anchor="middle" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">78e349e7</text>
<text x="172" y="149" font-size="10" text-anchor="middle" fill="#8A8F96">1 leg</text>
<rect x="332" y="62" width="236" height="96" rx="5" fill="#F4F2EE" stroke="#2F6B4F" stroke-width="2.2"/>
<text x="450" y="86" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2328">T · 10 bps (treatment)</text>
<text x="450" y="112" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">BisonFi</text>
<text x="450" y="132" font-size="11" text-anchor="middle" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">dea0ce94</text>
<text x="450" y="149" font-size="10" text-anchor="middle" fill="#8A8F96">1 leg</text>
<rect x="610" y="62" width="236" height="96" rx="5" fill="#F4F2EE" stroke="#B4B0A8" stroke-width="1.3"/>
<text x="728" y="86" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2328">A2 · 50 bps (anchor)</text>
<text x="728" y="112" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, Menlo, Consolas, monospace">Tessera V</text>
<text x="728" y="132" font-size="11" text-anchor="middle" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">78e349e7</text>
<text x="728" y="149" font-size="10" text-anchor="middle" fill="#8A8F96">1 leg</text>
<path d="M172,164 L172,176 L450,176 L450,164" fill="none" stroke="#8A6438" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="311" y="192" font-size="11" text-anchor="middle" fill="#8A6438" font-weight="600">? fully_different_route</text>
<path d="M450,164 L450,176 L728,176 L728,164" fill="none" stroke="#8A6438" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="589" y="192" font-size="11" text-anchor="middle" fill="#8A6438" font-weight="600">? fully_different_route</text>
<path d="M172,214 L172,226 L728,226 L728,214" fill="none" stroke="#2F6B4F" stroke-width="1.4"/>
<text x="450" y="242" font-size="11" text-anchor="middle" fill="#2F6B4F" font-weight="600">= exact_route_stable</text>
<text x="450" y="290" font-size="11.5" text-anchor="middle" fill="#1F2328">The two anchors returned the identical route. The treatment between them did not.</text>
<text x="450" y="308" font-size="11" text-anchor="middle" fill="#5F6368">Stable sentinels are necessary for a usable comparison — not sufficient to attribute the change.</text>
</svg>
