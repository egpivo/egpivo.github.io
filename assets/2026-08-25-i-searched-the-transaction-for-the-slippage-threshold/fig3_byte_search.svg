<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="t">What the payload search looked for, and what it matched</title>
<desc id="d">The minimum-output threshold and the difference produced no byte-equality match in any eligible bracket. The quoted output matched at a recurring instruction and offset in every eligible bracket.</desc>
<rect width="900" height="360" fill="#FBFAF8"/>
<defs>
<marker id="a-caused" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6B4F"/></marker>
<marker id="a-together" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A6438"/></marker>
<marker id="a-candidate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7A5C9E"/></marker>
<marker id="a-not_observed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8F96"/></marker>
</defs>
<text x="40" y="32" font-size="13" font-weight="600" fill="#1F2328">Searched in 5 route-stable brackets</text>
<text x="40" y="50" font-size="10" fill="#8A8F96">quantity</text>
<text x="330" y="50" font-size="10" fill="#8A8F96">value searched for</text>
<text x="560" y="50" font-size="10" fill="#8A8F96">result</text>
<rect x="30" y="38" width="820" height="48" rx="4" fill="#F4F2EE" stroke="#B4B0A8" stroke-width="1"/>
<text x="40" y="58" font-size="12.5" fill="#1F2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">otherAmountThreshold</text>
<text x="40" y="74" font-size="10" fill="#2F6B4F">the quantity slippage moves — the target</text>
<text x="330" y="58" font-size="12" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">1,360,375,278</text>
<text x="560" y="58" font-size="12" fill="#8A8F96" font-weight="600">x no match in any instruction payload</text>
<rect x="30" y="96" width="820" height="48" rx="4" fill="#FBFAF8" stroke="none" stroke-width="1"/>
<text x="40" y="116" font-size="12.5" fill="#1F2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">outAmount</text>
<text x="330" y="116" font-size="12" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">1,374,116,442</text>
<text x="560" y="116" font-size="12" fill="#7A5C9E" font-weight="600">~ match at ix 2, offset 99</text>
<rect x="30" y="154" width="820" height="48" rx="4" fill="#FBFAF8" stroke="none" stroke-width="1"/>
<text x="40" y="174" font-size="12.5" fill="#1F2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">outAmount_minus_threshold</text>
<text x="330" y="174" font-size="12" fill="#5F6368" font-family="ui-monospace, Menlo, Consolas, monospace">13,741,164</text>
<text x="560" y="174" font-size="12" fill="#8A8F96" font-weight="600">x no match in any instruction payload</text>
<text x="40" y="250" font-size="11.5" fill="#1F2328">The quantity the intervention controls was not the one found. The quantity that tracks market conditions was.</text>
<text x="40" y="270" font-size="10.5" fill="#7A5C9E">Byte equality only. A recurring offset match is a candidate encoding relationship, not a semantically decoded protocol field. No IDL or official decoder was used.</text>
<text x="40" y="302" font-size="11" font-weight="600" fill="#1F2328">Evidence class</text>
<line x1="40" y1="318" x2="66" y2="318" stroke="#7A5C9E" stroke-width="2.0" stroke-dasharray="7 4" opacity="1.0"/>
<text x="72" y="322" font-size="10.5" fill="#7A5C9E" font-weight="600">~</text>
<text x="86" y="322" font-size="10.5" fill="#5F6368">Candidate byte match</text>
<line x1="232.0" y1="318" x2="258.0" y2="318" stroke="#8A8F96" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.55"/>
<text x="264.0" y="322" font-size="10.5" fill="#8A8F96" font-weight="600">x</text>
<text x="278.0" y="322" font-size="10.5" fill="#5F6368">Not identified under this search</text>
</svg>
